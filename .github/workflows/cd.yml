﻿﻿﻿﻿﻿﻿name: 自动打包并发布release

on:
  push:
    branches:
      - master

  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.3.0)"
        required: true
        type: string

# 新的打包任务开始时，取消同组中仍在运行的旧任务
# 短时间内连续 merge 多个 PR 时，只保留最后一次打包
concurrency:
  group: auto-release
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  prepare:
    # pull_request 只有真正 merge 后才执行
    # workflow_dispatch 始终执行
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push'

    runs-on: windows-latest

    outputs:
      version: ${{ steps.version.outputs.version }}
      previous_version: ${{ steps.version.outputs.previous_version }}
      major_minor_changed: ${{ steps.version.outputs.major_minor_changed }}
      release_notes: ${{ steps.version.outputs.release_notes }}

    steps:
      - name: Determine release version
        id: version
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          $ErrorActionPreference = "Stop"

          # 该 tag 在远端是否已经存在
          # 用 git 协议直查，不经过 REST API，因此不会读到陈旧的列表快照
          function Test-TagExists {
            param([string]$Tag)

            $refs = git ls-remote --tags "https://github.com/$($env:REPOSITORY).git" "refs/tags/$Tag"

            if ($LASTEXITCODE -ne 0) {
              # 查不动就当「不存在」：兜底失败不应该让整个打包流程停下来，
              # 顶多退回「只信 gh release list」的原有行为
              Write-Warning "Could not list remote tags; skipping the duplicate-tag check."

              return $false
            }

            foreach ($ref in @($refs)) {
              # 完全匹配 refs/tags/v1.0.0，避免把 refs/tags/v1.0.0-rc1 误判为已存在
              if ($ref.Trim() -match "\srefs/tags/$([regex]::Escape($Tag))$") {
                return $true
              }
            }

            return $false
          }

          # 只把「正式 Release」（非 draft、非 prerelease）作为比较基准
          function Get-PublishedReleases {
            $json = gh release list `
              --repo $env:REPOSITORY `
              --limit 100 `
              --json tagName,isDraft,isPrerelease,publishedAt,body

            if ([string]::IsNullOrWhiteSpace($json)) {
              return @()
            }

            $parsed = $json | ConvertFrom-Json

            if ($null -eq $parsed) {
              return @()
            }

            return @(
              $parsed |
                Where-Object {
                  $_.isDraft -eq $false -and
                  $_.isPrerelease -eq $false -and
                  $_.tagName -match '^v\d+\.\d+\.\d+$'
                }
            )
          }

          # 解析 Release Notes 中已经列出的 PR 编号
          # 这样即使上一次打包的 Release 是在后一个 PR merge 之后才发布的，
          # 也不会重复统计，同时也不会漏掉「上一次没来得及记进去」的 PR
          function Get-NotePullRequestNumbers {
            param([string]$Notes)

            $numbers = @()

            if ([string]::IsNullOrWhiteSpace($Notes)) {
              return $numbers
            }

            $markerMatch = [regex]::Match($Notes, 'cd-notes-prs:\s*([0-9,\s]+)')

            if ($markerMatch.Success) {
              return @(
                $markerMatch.Groups[1].Value -split ',' |
                  ForEach-Object { $_.Trim() } |
                  Where-Object { $_ -match '^\d+$' } |
                  ForEach-Object { [int]$_ }
              )
            }

            # 兼容手工编辑过、没有标记的 Notes
            # 支持两种条目写法：
            #   - 标题 ([#123](url)) @user   （本 workflow 的格式）
            #   - 标题 (#123) @user          （旧格式）
            # GitHub 自动生成的 "by @user in ..." 这类条目不会被误当成 PR 编号
            foreach ($line in ($Notes -split "`r?`n")) {
              $lineMatch = [regex]::Match($line, '\(\[#(\d+)\]\([^)]*\)\)\s*$')

              if (-not $lineMatch.Success) {
                $lineMatch = [regex]::Match($line, '\(#(\d+)\)\s*$')
              }

              if ($lineMatch.Success) {
                $numbers += [int]$lineMatch.Groups[1].Value
              }
            }

            return $numbers
          }

          # 收集「上次发布之后 merge 进来的 PR」，并渲染成 Release Notes
          # 短时间连续 merge 时，最后一次打包会一次性列出所有漏掉的 PR
          function Get-ReleaseNotesFromMergedPullRequests {
            param(
              [int[]]$AlreadyNoted = @(),
              [DateTimeOffset]$SinceDate,
              [string]$VersionLabel
            )

            Write-Host "Collecting merged pull requests after $SinceDate..."
            Write-Host "Pull requests already listed in earlier notes: $($AlreadyNoted -join ', ')"

            $mergedPrsJson = gh pr list `
              --repo $env:REPOSITORY `
              --state merged `
              --limit 1000 `
              --json number,title,author,mergedAt,url,mergeCommit

            if ([string]::IsNullOrWhiteSpace($mergedPrsJson)) {
              return ""
            }

            # 注意：ConvertFrom-Json 的结果不要再套一层 @()
            # 否则整个数组会被当成一个元素，Where-Object 里的 $_ 会变成数组本身
            $mergedPrs = ConvertFrom-Json -InputObject $mergedPrsJson

            $changedPrs = @(
              $mergedPrs |
                Where-Object {
                  $null -ne $_ -and
                  $_.GetType().Name -eq 'PSCustomObject' -and
                  $_.mergedAt -ne $null -and
                  $alreadyNoted -notcontains $_.number -and
                  ([DateTimeOffset]::Parse($_.mergedAt) -gt $SinceDate)
                } |
                Sort-Object {
                  [DateTimeOffset]::Parse($_.mergedAt)
                }
            )

            Write-Host "Changed PR count for $VersionLabel`: $($changedPrs.Count)"

            foreach ($pr in $changedPrs) {
              Write-Host "  #$($pr.number) [$($pr.mergedAt)] $($pr.title) (@$($pr.author.login))"
            }

            if ($changedPrs.Count -eq 0) {
              return ""
            }

            # Notes 直接逐条列出 PR（标题 / 链接 / 作者），不加任何小节标题
            $notesLines = @()

            foreach ($pr in $changedPrs) {
              # 作者写成普通的 Markdown 链接（指向作者主页）：
              # 不用「@名字」，否则 GitHub 会把它当成 mention（高亮/通知作者）
              $authorLogin = ""
              $authorUrl = ""

              if ($null -ne $pr.author -and -not [string]::IsNullOrWhiteSpace($pr.author.login)) {
                $authorLogin = $pr.author.login
                $authorUrl = "https://github.com/$authorLogin"
              }

              if ([string]::IsNullOrWhiteSpace($authorUrl)) {
                $notesLines += "- $($pr.title) ([#$($pr.number)]($($pr.url)))"
              }
              else {
                $notesLines += "- $($pr.title) ([#$($pr.number)]($($pr.url))) [$authorLogin]($authorUrl)"
              }
            }

            # 隐藏的 HTML 注释：记录本次 Notes 覆盖了哪些 PR
            # GitHub 页面不会渲染它，下一次打包用它精确计算增量
            $coveredNumbers = ($changedPrs | ForEach-Object { $_.number }) -join ','

            $notesLines += ""
            $notesLines += "<!-- cd-notes-prs: $coveredNumbers -->"

            return ($notesLines -join "`n")
          }

          Write-Host "Checking latest release..."

          $publishedReleases = Get-PublishedReleases

          # 获取当前最新正式 Release
          $latestRelease = $publishedReleases | Select-Object -First 1

          if ($null -eq $latestRelease) {
            Write-Host "No release with a v<major>.<minor>.<patch> tag was found."
            Write-Host "The next version will be derived from scratch."

            if ($env:EVENT_NAME -eq "workflow_dispatch") {
              $version = $env:INPUT_VERSION
            }
            else {
              # 理论上仓库已有 Release
              # 如果没有 Release，则自动发布从 1.0.0 开始
              $version = "1.0.0"
            }

            if ($version -notmatch '^\d+\.\d+\.\d+$') {
              throw "Invalid version '$version'. Expected format: number.number.number (e.g. 1.3.0)."
            }

            # 兜底：列表里看不到正式 Release，不代表远端没有同名 tag
            # （例如刚发布完 Release 又立刻触发一次，可能读到陈旧的列表快照）
            $guard = 0

            while ((Test-TagExists "v$version") -and $guard -lt 100) {
              if ($env:EVENT_NAME -eq "workflow_dispatch") {
                throw "Release v$version already exists. Pick a higher version."
              }

              $autoParts = $version.Split('.')
              $nextPatch = [int]$autoParts[2] + 1
              $version = "$($autoParts[0]).$($autoParts[1]).$nextPatch"
              $guard = $guard + 1

              Write-Host "Tag already taken; trying v$version instead."
            }

            if ($guard -ge 100) {
              throw "Could not find a free version after 100 attempts (last tried v$version)."
            }

            $previousVersion = ""
            $majorMinorChanged = "false"

            # 没有任何历史 Release 时，把所有已 merge 的 PR 都列出来
            $releaseNotes = Get-ReleaseNotesFromMergedPullRequests `
              -AlreadyNoted @() `
              -SinceDate ([DateTimeOffset]::MinValue) `
              -VersionLabel $version
          }
          else {
            $previousVersion = $latestRelease.tagName -replace '^v', ''

            if ($previousVersion -notmatch '^\d+\.\d+\.\d+$') {
              throw "Latest release '$($latestRelease.tagName)' does not use semantic version format."
            }

            $previousParts = $previousVersion.Split('.')
            $previousMajor = [int]$previousParts[0]
            $previousMinor = [int]$previousParts[1]
            $previousPatch = [int]$previousParts[2]

            if ($env:EVENT_NAME -eq "workflow_dispatch") {
              $version = $env:INPUT_VERSION

              if ($version -notmatch '^\d+\.\d+\.\d+$') {
                throw "Invalid version '$version'. Expected format: number.number.number (e.g. 1.3.0)."
              }

              $parts = $version.Split('.')
              $major = [int]$parts[0]
              $minor = [int]$parts[1]
              $patch = [int]$parts[2]

              # 手动输入的版本必须严格大于当前 Release
              $isGreater =
                ($major -gt $previousMajor) -or
                (
                  $major -eq $previousMajor -and
                  $minor -gt $previousMinor
                ) -or
                (
                  $major -eq $previousMajor -and
                  $minor -eq $previousMinor -and
                  $patch -gt $previousPatch
                )

              if (-not $isGreater) {
                throw "Invalid version '$version'. Must be greater than the current release '$previousVersion'."
              }

              # 同一个 tag 不能重复发布：发布阶段会先删掉已有 Release，那会抹掉它原来的 note
              if (Test-TagExists "v$version") {
                throw "Release v$version already exists. Pick a higher version."
              }
            }
            else {
              # master push 自动触发时，当前 Release 的 patch + 1
              $patch = $previousPatch + 1
              $version = "$previousMajor.$previousMinor.$patch"

              # 兜底：如果算出来的 tag 在远端已经存在，就继续进位。
              # gh release list 有时会返回陈旧的列表快照（例如刚发布完 Release 又立刻触发一次），
              # 只信它的话可能算出一个已经存在的版本，进而在发布阶段误删已有的 Release。
              $guard = 0

              while ((Test-TagExists "v$version") -and $guard -lt 100) {
                Write-Host "Tag v$version already exists on the remote; bumping patch."

                $patch = $patch + 1
                $version = "$previousMajor.$previousMinor.$patch"
                $guard = $guard + 1
              }

              if ($guard -ge 100) {
                throw "Could not find a free version after 100 attempts (last tried v$version)."
              }
            }

            $parts = $version.Split('.')
            $major = [int]$parts[0]
            $minor = [int]$parts[1]

            # major 或 minor 任意一个发生变化都视为需要重新生成 Release Notes 的版本升级
            if (
              $major -ne $previousMajor -or
              $minor -ne $previousMinor
            ) {
              $majorMinorChanged = "true"
            }
            else {
              $majorMinorChanged = "false"
            }

            # Notes 的起点固定为「上一轮该版本线的 .0 版本」
            # 例如当前是 1.4.x，起点就是 v1.3.0，因此 1.4.0 会汇总 1.3.0 至今的所有 PR。
            # 同一版本线内的 patch 更新（1.3.3 -> 1.3.4）起点同样是 v1.3.0，
            # 但那条线上所有已发布 Notes 记录过的 PR 都会被排除，
            # 所以实际只会列出这次新增的 PR。
            $baselineTag = "v$previousMajor.$previousMinor.0"
            $baselineLabel = $baselineTag

            $baselineRelease = $publishedReleases |
              Where-Object { $_.tagName -eq $baselineTag } |
              Select-Object -First 1

            if ($null -eq $baselineRelease) {
              # 该版本线的 .0 版本不存在（例如历史上的第一个 Release 不是 .0）
              # 退回到该版本线里最早的 Release
              $baselineRelease = $publishedReleases |
                Where-Object {
                  $_.tagName -match "^v$previousMajor\.$previousMinor\.\d+$"
                } |
                Sort-Object {
                  [int](($_.tagName -replace "^v$previousMajor\.$previousMinor\.", ""))
                } |
                Select-Object -First 1

              if ($null -ne $baselineRelease) {
                $baselineTag = $baselineRelease.tagName
                Write-Host "Release $baselineLabel was not found; using the earliest release of this line instead: $baselineTag"
              }
            }

            # 只要「该版本线里任意一次已发布的 Notes」写过某个 PR，就不再重复列出
            # 这样 1.4.0 汇总 1.3.0 至今的 PR 时，不会把 1.3.2 / 1.3.9 时代已经写过的 PR 再抄一遍
            $alreadyNoted = @()

            $lineReleases = @(
              $publishedReleases |
                Where-Object {
                  $_.tagName -match "^v$previousMajor\.$previousMinor\.\d+$"
                }
            )

            foreach ($lineRelease in $lineReleases) {
              $alreadyNoted += @(Get-NotePullRequestNumbers -Notes $lineRelease.body)
            }

            $alreadyNoted = @($alreadyNoted | Sort-Object -Unique)

            if ($null -eq $baselineRelease) {
              $baselineTag = "(none)"
              $baselineDate = [DateTimeOffset]::MinValue

              Write-Host "Could not find a previous release for baseline $baselineLabel."
              Write-Host "Falling back to every merged pull request."
            }
            else {
              $baselineTag = $baselineRelease.tagName

              if ([string]::IsNullOrWhiteSpace($baselineRelease.publishedAt)) {
                $baselineDate = [DateTimeOffset]::MinValue
              }
              else {
                # 往前多取 5 分钟作为安全窗口：
                # Release 的 publishedAt 是「打包完成并发布」的时刻，
                # 如果某个 PR 刚好在上一次打包期间 merge，它的 mergedAt 会早于 publishedAt，
                # 但那次 Notes 是在更早的 prepare 阶段生成的，所以它并没有被记录进去。
                # 安全窗口把这些 PR 捞回来，已记录过的 PR 由 alreadyNoted 去重。
                $baselineDate = [DateTimeOffset]::Parse($baselineRelease.publishedAt).AddMinutes(-5)
              }

              Write-Host "Baseline release: $baselineTag (published $($baselineRelease.publishedAt))"
              Write-Host "Notes window starts at: $baselineDate"
            }

            Write-Host "PRs already covered by the v$previousMajor.$previousMinor.x notes: $($alreadyNoted -join ', ')"

            if ($majorMinorChanged -eq "true") {
              Write-Host "Major/minor version update detected."
              Write-Host "Previous release: $previousVersion"
              Write-Host "New release: $version"
              Write-Host "Aggregating every PR merged since the baseline release $baselineTag."
            }
            else {
              Write-Host "Patch-only update."
              Write-Host "Previous release: $previousVersion"
              Write-Host "New release: $version"
              Write-Host "Listing every PR merged since the baseline release $baselineTag."
            }

            $releaseNotes = Get-ReleaseNotesFromMergedPullRequests `
              -AlreadyNoted $alreadyNoted `
              -SinceDate $baselineDate `
              -VersionLabel $version
          }

          Write-Host "Release version: $version"
          Write-Host "Previous version: $previousVersion"
          Write-Host "Major/minor changed: $majorMinorChanged"

          # 写入 GitHub Actions outputs
          # 注意：Windows PowerShell 5.1 的 >> / Add-Content 默认写 UTF-16LE，
          # 会让 runner 无法解析 step output，因此必须显式指定 utf8 编码
          $outputLines = @(
            "version=$version"
            "previous_version=$previousVersion"
            "major_minor_changed=$majorMinorChanged"
            "release_notes<<EOF"
            $releaseNotes
            "EOF"
          )

          $outputLines | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

  build:
    needs: prepare

    runs-on: windows-latest

    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync

      - name: Sync version into source files
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          $ErrorActionPreference = "Stop"

          $version = $env:VERSION
          $repoDir = "src"

          Write-Host "Syncing program version to $version ..."

          gh repo clone $env:REPOSITORY $repoDir -- --depth 1

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to clone $($env:REPOSITORY)."
          }

          # 两处版本号：pyproject.toml 的 [project] version、tool/EXTRA.py 的 VERSION
          # 只替换版本号本身，不动引号/空格等原有写法
          $targets = @(
            @{
              Path    = Join-Path $repoDir "pyproject.toml"
              Pattern = '(?m)^(\s*version\s*=\s*")[^"]*(")'
            },
            @{
              Path    = Join-Path $repoDir "tool\EXTRA.py"
              Pattern = '(?m)^(\s*VERSION\s*=\s*")[^"]*(")'
            }
          )

          $changed = @()

          foreach ($target in $targets) {
            $file = $target.Path

            if (-not (Test-Path -LiteralPath $file)) {
              throw "Version file not found: $file"
            }

            $bytes = [System.IO.File]::ReadAllBytes($file)
            $hasBom = ($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF)

            $text = [System.IO.File]::ReadAllText($file)
            $matches = @([regex]::Matches($text, $target.Pattern))

            if ($matches.Count -ne 1) {
              throw "Expected exactly one version definition in $file but found $($matches.Count)."
            }

            $updated = [regex]::Replace($text, $target.Pattern, { param($m) $m.Groups[1].Value + $version + $m.Groups[2].Value })

            if ($updated -eq $text) {
              Write-Host "$file already at $version"
              continue
            }

            # 原文件有 BOM 就保留 BOM，没有就不加：
            # 只在版本号上做最小改动，避免引入看不见的字符差异
            [System.IO.File]::WriteAllText($file, $updated, (New-Object System.Text.UTF8Encoding($hasBom)))

            Write-Host "$file -> $version (BOM: $hasBom)"
            $changed += $file
          }

          if ($changed.Count -eq 0) {
            Write-Host "Version files already up to date. Nothing to commit."
            exit 0
          }

          # 进入克隆出来的仓库执行 git 命令：
          # 不要用 `git -C <仓库路径>` 再配一个带 src/ 前缀的相对路径 ——
          # -C 已经把工作目录切过去了，路径会再叠加一次 src/，必然 pathspec 不匹配
          $repoPath = (Resolve-Path -LiteralPath $repoDir).Path
          $repoRoot = (Resolve-Path -LiteralPath '.').Path

          # 相对仓库根目录的路径，交给 git 时必须用正斜杠
          $gitPaths = @(
            $changed | ForEach-Object {
              (($_.Substring($repoRoot.Length).TrimStart('\', '/')) -replace '\\', '/')
            }
          )

          if ($gitPaths.Count -ne $changed.Count) {
            throw "Failed to compute repository-relative paths for the version files."
          }

          Push-Location -LiteralPath $repoPath

          try {
            & git config user.name "github-actions[bot]"
            & git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            foreach ($gitPath in $gitPaths) {
              Write-Host "staging $gitPath"

              & git add -- $gitPath

              if ($LASTEXITCODE -ne 0) {
                throw "Failed to stage $gitPath."
              }
            }

            & git diff --cached --quiet

            if ($LASTEXITCODE -eq 0) {
              Write-Host "No staged changes. Nothing to commit."
              exit 0
            }

            # [skip ci]：避免这次版本号提交再次触发本 workflow
            & git commit -m "chore: bump version to v$version [skip ci]"

            if ($LASTEXITCODE -ne 0) {
              throw "Failed to commit the version bump."
            }

            # gh repo clone 会把远端命名为 upstream（不是 origin），本地分支也可能不叫 master
            $remote = "upstream"
            $remoteNames = @(& git remote)

            if ($remoteNames -notcontains $remote) {
              if ($remoteNames -contains "origin") {
                $remote = "origin"
              }
              else {
                throw "Could not find a git remote to push to (found: $($remoteNames -join ', '))."
              }
            }

            Write-Host "Pushing to remote '$remote' ..."

            $pushed = $false

            for ($attempt = 1; $attempt -le 3; $attempt++) {
              & git push $remote "HEAD:master"

              if ($LASTEXITCODE -eq 0) {
                $pushed = $true
                break
              }

              Write-Host "Push attempt $attempt failed; rebasing on $remote/master and retrying..."

              & git pull --rebase $remote master
            }

            if (-not $pushed) {
              throw "Failed to push the version bump commit."
            }

            Write-Host "Version $version committed and pushed to master."
          }
          finally {
            Pop-Location
          }

      - name: Build with PyInstaller
        run: |
          uv run pyinstaller SimSce.spec

      - name: Prepare release files
        shell: powershell
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"

          $version = $env:VERSION
          $releaseDir = "release/SimSce-v$version"

          New-Item -ItemType Directory -Force -Path $releaseDir

          Copy-Item "dist/SimSce/*" $releaseDir -Recurse -Force
          Copy-Item "actions" $releaseDir -Recurse -Force
          Copy-Item "config" $releaseDir -Recurse -Force
          Copy-Item "doc" $releaseDir -Recurse -Force
          Copy-Item "resource" $releaseDir -Recurse -Force

          Copy-Item "LICENSE" $releaseDir -Force
          Copy-Item "README.md" $releaseDir -Force
          Copy-Item "README_CHT.md" $releaseDir -Force
          Copy-Item "README_ENG.md" $releaseDir -Force

      - name: Create ZIP
        shell: powershell
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"

          $version = $env:VERSION

          Compress-Archive `
            -Path "release/SimSce-v$version" `
            -DestinationPath "SimSce-v$version.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimSce-v${{ needs.prepare.outputs.version }}
          path: SimSce-v${{ needs.prepare.outputs.version }}.zip

  release:
    needs:
      - prepare
      - build

    runs-on: windows-latest

    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: SimSce-v${{ needs.prepare.outputs.version }}
          path: release

      - name: Publish GitHub Release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PREVIOUS_VERSION: ${{ needs.prepare.outputs.previous_version }}
          MAJOR_MINOR_CHANGED: ${{ needs.prepare.outputs.major_minor_changed }}
          RELEASE_NOTES: ${{ needs.prepare.outputs.release_notes }}
          REPOSITORY: ${{ github.repository }}
        run: |
          $ErrorActionPreference = "Stop"

          $version = $env:VERSION
          $previousVersion = $env:PREVIOUS_VERSION
          $majorMinorChanged = $env:MAJOR_MINOR_CHANGED
          $releaseNotes = $env:RELEASE_NOTES

          $tag = "v$version"
          $asset = "release/SimSce-v$version.zip"

          Write-Host "Preparing release $tag"

          # 直接删除旧 Release + tag，创建一个完全新的 Release
          # 删除动作放在 build 完成以后，避免新的 workflow 在 build 阶段读取不到当前 Release

          if ($majorMinorChanged -eq "true") {
            Write-Host "Major/minor update detected."
            Write-Host "Previous release: v$previousVersion"
            Write-Host "New release: $tag"

            $previousTag = "v$previousVersion"

            $previousReleaseExists = $true

            try {
              gh release view $previousTag `
                --repo $env:REPOSITORY `
                | Out-Null
            }
            catch {
              $previousReleaseExists = $false
            }

            if ($previousReleaseExists) {
              Write-Host "Deleting previous release $previousTag..."

              gh release delete $previousTag `
                --repo $env:REPOSITORY `
                --cleanup-tag `
                --yes

              Write-Host "Previous release and tag removed."
            }
            else {
              Write-Host "Previous release $previousTag does not exist."
            }
          }

          # 防止极短时间内的竞态：如果同一个目标 tag 已经被另一个 workflow 创建，删除它并重新创建
          # 最终 Release 一定对应当前 workflow 的完整 build

          $targetReleaseExists = $true

          try {
            gh release view $tag `
              --repo $env:REPOSITORY `
              | Out-Null
          }
          catch {
            $targetReleaseExists = $false
          }

          if ($targetReleaseExists) {
            Write-Host "Release $tag already exists."
            Write-Host "Removing it before creating the new release."

            gh release delete $tag `
              --repo $env:REPOSITORY `
              --cleanup-tag `
              --yes
          }

          # 创建全新的 Release

          if ([string]::IsNullOrWhiteSpace($releaseNotes)) {
            Write-Host "Creating release without generated PR notes."

            gh release create $tag `
              $asset `
              --title $tag `
              --repo $env:REPOSITORY

            if ($LASTEXITCODE -ne 0) {
              throw "GitHub Release creation failed."
            }
          }
          else {
            Write-Host "Creating release with merged PR titles."

            # 将多行 Release Notes 写入临时文件，避免 PowerShell 多行字符串通过命令行传递时出现转义问题
            $notesFile = Join-Path $env:RUNNER_TEMP "release-notes.md"

            # 必须是「不带 BOM 的 UTF-8」：
            # Set-Content -Encoding UTF8 会写入 BOM，BOM 会出现在 Release 正文开头（一个看不见的字符）
            $notesText = ($releaseNotes -replace "`r`n", "`n").TrimEnd("`n") + "`n"

            [System.IO.File]::WriteAllText($notesFile, $notesText, (New-Object System.Text.UTF8Encoding($false)))

            gh release create $tag `
              $asset `
              --title $tag `
              --notes-file $notesFile `
              --repo $env:REPOSITORY

            if ($LASTEXITCODE -ne 0) {
              throw "GitHub Release creation failed."
            }
          }

          Write-Host "Release $tag created successfully."
